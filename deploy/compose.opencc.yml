name: opencc-web
services:
  app:
    image: opencc-web:2026-10-24
    build:
      context: ..
      args:
        VERSION: opencc-2026-10-24
    network_mode: host
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    env_file: .env.opencc
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: "8088"
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "55432"
      DATABASE_USER: opencc
      DATABASE_DBNAME: opencc
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env.opencc}
      DATABASE_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "56379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Fill REDIS_PASSWORD in .env.opencc}
      JWT_SECRET: ${JWT_SECRET:?Fill JWT_SECRET in .env.opencc}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Fill TOTP_ENCRYPTION_KEY in .env.opencc}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Fill ADMIN_EMAIL in .env.opencc}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Fill ADMIN_PASSWORD in .env.opencc}
      OPENCC_CNY_PER_CREDIT: "1"
      OPENCC_GATEWAY_URL: https://opencc.app
      OPENCC_GEO_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
      TZ: Asia/Shanghai
    volumes: [opencc-data:/app/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8088/health]
      interval: 30s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencc
      POSTGRES_DB: opencc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [opencc-postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U opencc -d opencc"]
      interval: 10s
      retries: 10
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Fill REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:56379:6379"]
    volumes: [opencc-redis:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      retries: 10
volumes:
  opencc-data:
  opencc-postgres:
  opencc-redis:
